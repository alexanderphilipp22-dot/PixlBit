# Mehr Heap fuer den Gradle-Daemon bei groesseren Builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX ist Pflicht
android.useAndroidX=true

# Kotlin-Code-Style
kotlin.code.style=official

# Gradle-Konfigurationscache fuer schnellere wiederholte Builds
org.gradle.configuration-cache=true
org.gradle.caching=true

# SHA-256-Fingerprint (ohne Doppelpunkte) des Release-Signing-Keystores fuer die
# Laufzeit-Signatur-Attestierung (Anti-Repackaging). Leer lassen => Signatur-
# pruefung wird uebersprungen (Entwicklungsmodus). Beispiel:
# RELEASE_SIGNATURE_SHA256=AB12CD34EF567890...
RELEASE_SIGNATURE_SHA256=
